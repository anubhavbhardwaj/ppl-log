<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Training, leave and travel in one place.">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Cadence: one-column phone app. Bottom tab bar, session tags colored like competition plates (red push, blue pull, yellow legs).
   Leave colors: teal vacation, orange year-end, violet work from India. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e3e8ee; --line:#d3dae2;
  --fg:#17202b; --muted:#5b6878; --accent:#1f4fd1; --accent-fg:#ffffff;
  --push:#d32f2f; --pull:#1f4fd1; --legs:#e0a800; --home:#2e8b57;
  --good:#2e8b57; --warn:#b26a00;
  --vac:#0f8a84; --ye:#c4501a; --wfi:#7048c8; --vac-bg:#d5efed; --ye-bg:#f8e0d4; --wfi-bg:#e6ddf7; --trip-bg:#e9edf2; --bad:#c62828;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#18202a; --surface-2:#222c38; --line:#2c3846;
  --fg:#e6ebf1; --muted:#93a1b2; --accent:#6f95ff; --accent-fg:#0c1220;
  --push:#ff6b61; --pull:#6f95ff; --legs:#f2c230; --home:#4cc287; --good:#4cc287; --warn:#f0a83a; --vac:#3cc4bb; --ye:#ff8a50; --wfi:#a98bff; --vac-bg:#123a38; --ye-bg:#43261a; --wfi-bg:#2c2350; --trip-bg:#1f2833; --bad:#ff6b61; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --surface-2:#222c38; --line:#2c3846;
  --fg:#e6ebf1; --muted:#93a1b2; --accent:#6f95ff; --accent-fg:#0c1220;
  --push:#ff6b61; --pull:#6f95ff; --legs:#f2c230; --home:#4cc287; --good:#4cc287; --warn:#f0a83a; --vac:#3cc4bb; --ye:#ff8a50; --wfi:#a98bff; --vac-bg:#123a38; --ye-bg:#43261a; --wfi-bg:#2c2350; --trip-bg:#1f2833; --bad:#ff6b61; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800}
h2{font-size:24px;font-weight:700}
h3{font-size:19px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase}
.plate{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.plate.push{background:var(--push)} .plate.pull{background:var(--pull)} .plate.legs{background:var(--legs)} .plate.home{background:var(--home)}
.hero{border-left:6px solid var(--accent);}
.hero.push{border-left-color:var(--push)} .hero.pull{border-left-color:var(--pull)} .hero.legs{border-left-color:var(--legs)} .hero.home{border-left-color:var(--home)}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;min-width:0}
.dayc .d{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.dayc .k{font-family:var(--display);font-weight:700;font-size:14px}
.dayc.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dayc.push{border-top:3px solid var(--push)}.dayc.pull{border-top:3px solid var(--pull)}.dayc.legs{border-top:3px solid var(--legs)}
.dayc .tick{font-size:12px;color:var(--good);font-weight:700;height:16px}
/* exercise card */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.ex.done{opacity:.72}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-h h3{min-width:0}
.spec{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.spec div{background:var(--surface-2);border-radius:8px;padding:6px;text-align:center;min-width:0}
.spec b{display:block;font-variant-numeric:tabular-nums;font-size:14px}
.spec span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sets{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center;margin-top:10px}
.sets input{width:100%;min-width:0;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-variant-numeric:tabular-nums;text-align:center}
.sets .sn{font-size:12px;font-weight:700;color:var(--muted);width:42px}
select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;max-width:100%}
textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
.hint{font-size:13px;padding:6px 8px;border-radius:8px;background:var(--surface-2)}
.hint.up{color:var(--good)}
.list{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.list li > div{min-width:0}
/* plan grid */
.pgrid{display:grid;grid-template-columns:auto repeat(6,1fr);gap:4px;font-size:12px;overflow-x:auto}
.pgrid .h{font-weight:700;color:var(--muted);text-align:center;font-size:11px}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 2px;text-align:center;font-family:var(--display);font-weight:700;font-size:13px;color:var(--fg)}
.cell.done{background:var(--surface-2);color:var(--muted)}
.cell.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pgrid .ph{grid-column:1/-1;font-family:var(--display);font-weight:700;font-size:14px;margin:8px 0 2px;color:var(--fg)}
.pgrid .dl{font-size:9px;color:var(--warn);text-transform:uppercase}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.optc{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;text-align:left}
.optc.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.optc.on .muted{color:inherit;opacity:.8}
.cell .plate{display:inline-block;width:8px;height:8px;margin-right:3px;vertical-align:middle}
/* tabbar & timer */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabbar button{background:none;border:0;padding:12px 4px;font-weight:700;color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.tabbar button[aria-current="true"]{color:var(--accent)}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;z-index:6;font-variant-numeric:tabular-nums;font-weight:700}
.timer button{background:var(--bg);color:var(--fg);border:0;border-radius:999px;padding:4px 10px;font-weight:700}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:600;z-index:7}
.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;margin-top:4px}
.banner{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--surface-2);color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:3px;width:18px;height:18px;flex:none}
@media (prefers-reduced-motion: no-preference){.btn,.cell{transition:transform .08s}.btn:active{transform:scale(.98)}}
/* segmented control */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:8px;border-radius:8px;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* travel */
.tripline{display:flex;gap:10px;align-items:center;text-align:left;width:100%;color:var(--fg);font:inherit;cursor:pointer}
.tripline .plate{width:14px;height:14px}
.yearpick{gap:4px}.yearpick b{font-family:var(--display);font-size:20px;min-width:44px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.tile .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05}
.tile .big.bad{color:var(--bad)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:3px}
.card.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);flex:none}
.badge.booked{background:var(--vac-bg);color:var(--vac)}.badge.planned{background:var(--surface-2);color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2)}
.chip.vacation{background:var(--vac-bg);color:var(--vac)}.chip.yearEnd{background:var(--ye-bg);color:var(--ye)}.chip.wfi{background:var(--wfi-bg);color:var(--wfi)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:8px 0 10px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i.cd{width:14px;height:14px;display:inline-block;border-radius:4px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mname{font-family:var(--display);font-weight:700;font-size:15px;margin-bottom:4px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mgrid .wd{font-size:9px;font-weight:700;color:var(--muted);text-align:center}
.cd{font-size:11px;text-align:center;border-radius:4px;padding:2px 0;font-variant-numeric:tabular-nums;line-height:1.5}
.cd.we{color:var(--muted)}
.cd.intrip{background:var(--trip-bg)}
.cd.vacation{background:var(--vac);color:#fff}.cd.yearEnd{background:var(--ye);color:#fff}.cd.wfi{background:var(--wfi);color:#fff}
.cd.hol{box-shadow:inset 0 0 0 1.5px var(--push);font-weight:700}
.cd.now{outline:2px solid var(--fg);outline-offset:-1px}
.strike{text-decoration:line-through}
details.card summary{font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2 label,.grid3 label{min-width:0}
.lblock{border-left:4px solid var(--vac);padding-left:8px;display:flex;flex-direction:column;gap:4px}
.lblock.yearEnd{border-left-color:var(--ye)}.lblock.wfi{border-left-color:var(--wfi)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.brow input,.brow select{width:100%;min-width:0;padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:13px}
input[type=date].field{min-height:44px}
.lblock .field{margin-top:0;padding:9px 8px}
.fares{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.fares.first{border-top:0;margin-top:0;padding-top:0}
.triplist{display:flex;flex-direction:column;gap:8px}
.triprow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:inherit;cursor:pointer}
.triprow .plate{width:14px;height:14px}
.tr-main{display:flex;flex-direction:column;min-width:0;flex:1}
.tr-main b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--muted);font-size:22px;line-height:1}
.bk{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap;flex:none;background:var(--surface-2);color:var(--muted)}
.bk.window{background:var(--wfi-bg);color:var(--wfi)}.bk.now,.bk.late{background:var(--vac);color:#fff}.bk.booked{background:var(--vac-bg);color:var(--vac)}
.booking .bk-head{margin:6px 0 8px}
.bignum{font-family:var(--display);font-weight:800;font-size:44px;line-height:1}
.bignum.now{color:var(--vac);font-size:34px}
.bk-bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:4px 0}
.bk-bar span{display:block;height:100%;background:var(--wfi)}
.booking.now .bk-bar span,.booking.late .bk-bar span{background:var(--vac)}
.bk-facts{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.booknudge.now,.booknudge.late{border-color:var(--vac)}
.card.reco{border-color:var(--accent)}
.chip.pe{background:var(--wfi-bg);color:var(--wfi)}
.pe-line{color:var(--wfi);font-weight:600}
.fares details{margin-top:6px}
.fare-list{margin-top:8px}
.fare-list li{padding:6px 8px;border-radius:8px}
.fare-list li.best{background:var(--vac-bg)}
.fare-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.lvl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lvl.low{color:var(--good)}.lvl.high{color:var(--bad)}
.save{color:var(--good);font-weight:600}
.ldelta{font-weight:600;color:var(--fg)}
.card.install{border-color:var(--accent)}
@media (max-width:380px){.tiles .big{font-size:28px}}
</style>
</head>
<body>

<div class="wrap" id="app" aria-live="polite">
  <div class="stack">
    <h1>Cadence</h1>
    <div class="card"><div class="label">Loading</div><p class="muted">Getting your training and travel.</p></div>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections">
  <button data-tab="today" aria-current="true">Today</button>
  <button data-tab="gym">Gym</button>
  <button data-tab="travel">Travel</button>
</nav>
<div id="timer" class="timer" hidden></div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
